[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AI-Substrate/Unisphere"

[workspace.dependencies]
unisphere-core = { path = "crates/core" }
unisphere-sdk = { path = "crates/sdk" }
unisphere-cli = { path = "crates/cli" }
unisphere-testkit = { path = "crates/testkit" }
unisphere-loader-jsonl = { path = "crates/loader-jsonl" }
unisphere-adapter-claude = { path = "crates/adapter-claude" }
unisphere-output-otlp = { path = "crates/output-otlp" }
unisphere-adapter-codex = { path = "crates/adapter-codex" }
unisphere-adapter-omp = { path = "crates/adapter-omp" }
unisphere-adapter-pi = { path = "crates/adapter-pi" }
unisphere-adapter-copilot-cli = { path = "crates/adapter-copilot-cli" }
unisphere-adapter-cursor = { path = "crates/adapter-cursor" }
unisphere-adapter-vscode-copilot = { path = "crates/adapter-vscode-copilot" }
unisphere-loader-snapshot = { path = "crates/loader-snapshot" }
rusqlite = { version = "0.37", features = ["bundled", "limits", "modern_sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
libc = "0.2"
