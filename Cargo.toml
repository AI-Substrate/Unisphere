[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/AI-Substrate/Unisphere"

[workspace.dependencies]
unisphere-core = { path = "crates/core" }
unisphere-sdk = { path = "crates/sdk" }
unisphere-cli = { path = "crates/cli" }
unisphere-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
